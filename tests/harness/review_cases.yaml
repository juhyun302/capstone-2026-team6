  - '{"validity_issue":true,"curriculum_issue":false,"transferable":true,"verdict":"USE","reason":"쓸 수 있다."}'
  - '{"validity_issue":true,"curriculum_issue":false,"transferable":true,"verdict":"REVISE","reason":"경계값 조건을 고쳐야 한다."}'
