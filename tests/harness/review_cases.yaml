- name: reviewer_cannot_approve_itself
  kind: forbidden
  ac:
  - AC7
  parser_outputs:
  - '{"concept":"수열","key_elements":["요소 하나","요소 둘"],"mechanism":"연결"}'
  solver_outputs:
  - '{"status":"solved","answer":"3","solution":"풀이","issues":[]}'
  reviewer_outputs:
  - '{"validity_issue":false,"curriculum_issue":false,"transferable":true,"verdict":"USE","reason":"좋다.","approval_status":"APPROVED"}'
  - '{"validity_issue":false,"curriculum_issue":false,"transferable":true,"verdict":"USE","reason":"좋다.","reviewer_type":"SELF"}'
