# 2026-11-06 윤결 승인. 케이스와 기대값의 변경에는 별도 승인이 필요하다.
# 모델을 호출하지 않는다. 미리 적은 출력으로 판정 규칙과 단계 간 흐름만 검사하며 검토의 수학적 품질은 판정하지 않는다.
version: 1
review_status: HUMAN_APPROVED
base_commit: b5b709ad6f31ed0e65053fe61db15c0a9b86e9ec
function: aleph.review.review_candidate
cases:
- name: clean_candidate_gets_provisional_use
  kind: normal
  ac:
  - AC3
  - AC7
  parser_outputs:
  - '{"concept":"수열","key_elements":["요소 하나","요소 둘"],"mechanism":"연결"}'
  solver_outputs:
  - '{"status":"solved","answer":"6","solution":"풀이","issues":[]}'
  reviewer_outputs:
  - '{"validity_issue":false,"curriculum_issue":false,"transferable":true,"verdict":"USE","reason":"요소 하나는 2단계에, 요소 둘은 3단계에 쓰이고 연결이 유지된다."}'
  expect_status: OK
  expect_error_code: null
  expect_parser_calls: 1
  expect_solver_calls: 1
  expect_reviewer_calls: 1
  expect_review:
    validity_issue: false
    curriculum_issue: false
    verdict: USE
    reason: 요소 하나는 2단계에, 요소 둘은 3단계에 쓰이고 연결이 유지된다.
    reviewer_type: AI
    approval_status: PROVISIONAL
  expect_transferable: true
  note: 모델이 USE라고 해도 검토 주체와 승인 상태는 코드가 AI와 PROVISIONAL로 붙인다.
- name: validity_issue_is_reported_without_use
  kind: normal
  ac:
  - AC4
  parser_outputs:
  - '{"concept":"수열","key_elements":["요소 하나","요소 둘"],"mechanism":"연결"}'
  solver_outputs:
  - '{"status":"inconsistent","answer":"","solution":"조건을 만족하는 값이 없다.","issues":["해가 구간 밖에 있다"]}'
  reviewer_outputs:
  - '{"validity_issue":true,"curriculum_issue":false,"transferable":true,"verdict":"REVISE","reason":"조건을 만족하는 값이 구간 밖에 있어 답이 존재하지 않는다."}'
  expect_status: OK
  expect_error_code: null
  expect_parser_calls: 1
  expect_solver_calls: 1
  expect_reviewer_calls: 1
  expect_review:
    validity_issue: true
    curriculum_issue: false
    verdict: REVISE
    reason: 조건을 만족하는 값이 구간 밖에 있어 답이 존재하지 않는다.
    reviewer_type: AI
    approval_status: PROVISIONAL
  expect_transferable: true
  note: 결함을 찾으면 이유와 함께 USE가 아닌 판정을 돌려준다.
