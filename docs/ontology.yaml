# Aleph 미니 도메인 온톨로지 (강의 2 산출물 ②)
#
# 작성 지침: docs/guides/강의02_도메인발견_온톨로지_작성지침.md
# 근거 원천: docs/research/interviews.md
#
# ── 절대 규칙 ────────────────────────────────────────────────────────────
# 1. evidence: 는 docs/research/interviews.md 의 로그 번호(관찰 기록은 '관찰 N').
#    클래스 / 속성 / 관계 세 층 전부에 붙인다.
#    근거로 역추적되지 않는 항목은 두지 않는다.
# 2. relations 의 대상은 반드시 이 파일에 정의된 클래스여야 한다(미정의 클래스 참조 금지).
# 3. 동의어는 대표어 하나로 합친다. 대표어가 흔들리면 스펙·코드·테스트가 어긋난다.
# 4. 여기서 정의하는 것은 클래스(개념 유형)다.
#    개별 사례(특정 기출 문항, 특정 해설)는 인스턴스이자 데이터이므로 정의하지 않는다.
# ─────────────────────────────────────────────────────────────────────────
#
# ── 작성 전 중간 단계 (로그가 쌓인 뒤 채운다) ────────────────────────────
# 반복된 명사 → 클래스·속성 후보:
# 반복된 동사 → 관계 후보:
# 동의어 통합:            =            → 대표어 ``
# ─────────────────────────────────────────────────────────────────────────

version: 1

classes:
  # <클래스명>:
  #   description: <이 개념이 무엇인지 한 줄>
  #   evidence: [로그 _, 로그 _]                                   # ① 클래스의 근거 (필수)
  #   attributes:
  #     <속성명>: {type: <타입>, examples: [<예시>], evidence: [로그 _]}   # ② 속성의 근거
  #   relations:
  #     - <관계(동사)>: <대상 클래스>                              # 반드시 이 파일에 정의된 클래스
  #       evidence: [로그 _]                                       # ③ 관계의 근거

# 범위 밖(명시): <이번 개발 범위에서 다루지 않을 개념>
# 핵심 흐름: <클래스> --(동사)--> <클래스> --(동사)--> <클래스>
